
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Referrers can also contain query-string authentication tokens.
    map $http_referer $referer_without_args {
        default "";
        ~^([^?]*) $1;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent "$referer_without_args" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'request_id=$request_id upstream_addr="$upstream_addr" '
                      'upstream_connect_time="$upstream_connect_time" '
                      'upstream_header_time="$upstream_header_time" '
                      'upstream_response_time="$upstream_response_time" '
                      'request_time=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    proxy_set_header  X-Real-IP  $remote_addr;
    proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header  X-Forwarded-Host $http_host;
    proxy_set_header  Host $http_host;
    # Keep headers together so proxy locations inherit the complete set.
    proxy_set_header  X-Request-ID $request_id;

    upstream gateway {
        server  gateway:8000;
    }

    upstream edge {
        server  edge:8000;
    }

    # Set long timeouts for MALLARD.
    proxy_connect_timeout 75;
    proxy_send_timeout 600;
    proxy_read_timeout 600;

    include /local-sites-enabled/*.conf;
}
