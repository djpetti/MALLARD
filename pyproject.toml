[tool.poetry]
name = "mallard"
version = "0.3.2"
description = "MAchine Learning Large ARtifact Database"
authors = ["Daniel Petti <djpetti@gmail.com>", "Justin Hong <wjtw9802@gmail.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "~3.13"
pydantic = "^2.10.6"
fastapi = "^0.115.8"
uvicorn = { extras = ["standard"], version = "^0.20.0" }
python-multipart = "^0.0.5"
Pillow = "^11.1.0"
confuse = "^1.4.0"
loguru = "^0.5.3"
exifread = "^2.3.2"
aioitertools = "^0.7.1"
python-irodsclient = "^3.0.0"
tenacity = "^6.3.1"
aiohttp = "^3.11.12"
gunicorn = "^20.0.4"
aiofiles = "^0.6.0"
jinja2 = "^3.1.1"
aiobotocore = "^2.19.0"
SQLAlchemy = "^2.0.38"
aiomysql = "^0.1.1"
alembic = "^1.6.4"
methodtools = "^0.4.7"
fief-client = "^0.20.0"
frozenlist = "^1.5.0"
greenlet = "^3.1.1"
uvloop = "^0.21.0"
pyyaml = "^6.0.2"
httptools = "^0.6.4"
filetype = "^1.2.0"
cffi = "^1.17.1"
makefun = "^1.15.6"
asyncstdlib = "^3.13.0"

[tool.poetry.group.dev.dependencies]
black = "^22.12.0"
flake8 = "^7.1.2"
pre-commit = "^4.5.0"
pytest = "^8.3.5"
pytest_mock = "^3.14.0"
pytest-asyncio = "^0.25.3"
pytest_faker = "^2.0.0"
python-dateutil = "^2.8.1"
requests = "^2.25.1"
pytest-cov = "^2.11.1"
pytest-flake8 = "^1.3.0"
pytest-black = "^0.6.0"
aiosqlite = "^0.17.0"
PyMySQL = ">=0.9"
Faker = "^13.3.4"
pytest-xdist = "^3.6.1"
cookiecutter = "^2.1.1"

[tool.black]
line-length = 79
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.venv
    | build
    | dist
  )/
)
'''

[tool.isort]
profile = "black"
line_length = 79
skip = "('.eggs', '.git', '.venv', 'build', 'dist')"

[tool.kedro]

[build-system]
requires = ["poetry>=1.2.0"]
build-backend = "poetry.masonry.api"
